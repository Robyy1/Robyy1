<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Shop Overlay -->
  <div id="shopOverlay" class="overlay">
    <div class="shop-container">
      <h1 class="shop-title">🛒 SPACE SHOP 🛒</h1>
      <div class="shop-coins">Coins: <span id="shopCoins">0</span></div>

      <div class="shop-section">
        <h2 class="section-title">— SHIPS —</h2>
        <div class="shop-items" id="shipsContainer"></div>
      </div>

      <div class="shop-section">
        <h2 class="section-title">— GUNS —</h2>
        <div class="shop-items" id="gunsContainer"></div>
      </div>

      <div class="shop-section">
        <h2 class="section-title">— CONSUMABLES —</h2>
        <div class="shop-items" id="consumablesContainer"></div>
      </div>

      <div class="shop-footer">
        <div id="currentShipDisplay">Selected: Classic</div>
        <button class="btn btn-close" id="closeShopBtn">Close (B)</button>
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="overlay">
    <div class="gameover-container">
      <h1 class="gameover-title">GAME OVER</h1>
      <div class="gameover-stats">
        <div>Final Score: <span id="finalScore">0</span></div>
        <div>Coins Earned: <span id="finalCoins">0</span></div>
        <div>Waves Survived: <span id="finalWaves">0</span></div>
      </div>
      <button class="btn btn-restart" id="restartBtn">Play Again (SPACE)</button>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="overlay">
    <div class="pause-container">
      <h1>PAUSED</h1>
      <button class="btn btn-resume" id="resumeBtn">Resume (ESC)</button>
      <button class="btn btn-quit" id="quitBtn">Quit to Menu</button>
    </div>
  </div>

  <!-- HUD element for current weapon/consumable display -->
  <div id="hudExtra">
    <div id="weaponDisplay"></div>
    <div id="consumableDisplay"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
