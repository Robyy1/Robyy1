<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Keystroke</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar" aria-label="Main navigation">
      <div class="navbar-inner">
        <a href="/" class="navbar-brand" aria-label="Keystroke home">
          <span class="logo-icon" aria-hidden="true">&gt;_</span>
          <span class="logo-text">keystroke</span>
        </a>
        <ul class="navbar-links">
          <li><a href="/type.html" class="navbar-link">Type</a></li>
          <li><a href="/dashboard.html" class="navbar-link">Dashboard</a></li>
          <li><a href="/learning.html" class="navbar-link">Learning</a></li>
          <li>
            <a href="/leaderboard.html" class="navbar-link">Leaderboard</a>
          </li>
        </ul>
        <div class="navbar-user">
          <a href="/login.html" class="btn btn-ghost">Log in</a>
          <a href="/signup.html" class="btn btn-primary">Sign up</a>
        </div>
      </div>
    </nav>

    <!-- Auth card -->
    <main class="auth-page">
      <div class="card auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">
          Sign in to save your results and track progress.
        </p>

        <div
          id="login-form-msg"
          class="alert"
          role="alert"
          style="display: none"
        ></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email"
              >Email or username</label
            >
            <input
              type="text"
              id="login-email"
              class="form-input"
              placeholder="you@example.com"
              required
              autocomplete="username"
            />
            <span id="login-email-error" class="form-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="form-password-wrapper">
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="current-password"
                style="padding-right: 48px"
              />
              <button
                type="button"
                id="login-pass-toggle"
                class="form-password-toggle"
                aria-label="Toggle password visibility"
              >
                &#128065;
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Sign in
          </button>
        </form>

        <p class="auth-footer">
          Don't have an account? <a href="/signup.html">Sign up</a>
        </p>
      </div>
    </main>

    <!-- Scripts -->
    <script src="/js/theme.js"></script>
    <script src="/js/auth-client.js"></script>
  </body>
</html>
