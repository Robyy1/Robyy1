<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course — Keystroke</title>
  <meta name="description" content="Course lessons with sequential unlock.">

  <!-- Theme before first paint -->
  <script>
    (function() {
      var t = localStorage.getItem('keystroke-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var a = localStorage.getItem('keystroke-accent');
      if (!a || ['amber','cyan','violet','rose','mono'].indexOf(a) === -1) a = 'amber';
      var m = localStorage.getItem('keystroke-motion');
      if (!m || ['system','on','off'].indexOf(m) === -1) m = 'system';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-accent', a);
      document.documentElement.setAttribute('data-motion', m);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/css/tokens.css" rel="stylesheet" />
  <link href="/css/base.css" rel="stylesheet" />
  <link href="/css/components.css" rel="stylesheet" />
  <link href="/css/pages.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="/" class="logo" aria-label="Keystroke home">
        <span class="logo-icon" aria-hidden="true">&gt;_</span>
        <span class="logo-text">keystroke</span>
      </a>
      <div class="nav-links">
        <a href="/type.html" class="nav-link">Type</a>
        <a href="/learning.html" class="nav-link">Learning</a>
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/leaderboard.html" class="nav-link">Leaderboard</a>
      </div>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </nav>

  <main class="learning-page">
    <a href="/learning.html" class="back-link">&larr; All courses</a>

    <section class="course-hero" id="courseHero" aria-label="Course overview">
      <p class="loading-text" id="courseLoading">Loading course…</p>
    </section>

    <section class="lesson-list" id="lessonList" aria-label="Course lessons"></section>
  </main>

  <button class="theme-toggle-float" id="themeToggleFloat" aria-label="Toggle theme">
    <span class="theme-icon-sun" aria-hidden="true">&#9728;</span>
    <span class="theme-icon-moon" aria-hidden="true">&#9790;</span>
  </button>

  <footer class="footer" role="contentinfo">
    <div class="footer-inner">
      <p>&copy; 2024 Keystroke. Type code faster.</p>
    </div>
  </footer>

  <script src="/js/theme.js"></script>
  <script src="/js/auth-client.js"></script>
  <script src="/js/course.js"></script>
</body>
</html>
