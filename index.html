<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: monospace;
        }
        canvas {
            border: 3px solid #4CAF50;
            background-color: #000;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
    // --- Game Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game settings
    const gridSize = 20;
    const tileCount = canvas.width / gridSize; // 20x20 grid
    let gameSpeed = 150; // Milliseconds per frame (controls game speed)

    // Snake initial state
    let snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 }
    ];
    let food = { x: 5, y: 5 };
    let dx = 1; // direction x (1 right, -1 left, 0 none)
    let dy = 0; // direction y (1 down, -1 up, 0 none)
    let score = 0;

    // --- Drawing Functions ---

    function draw() {
        // Clear the canvas
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw food (Red Square)
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);

        // Draw snake (Green Squares)
        ctx.fillStyle = 'lime';
        snake.forEach((segment, index) => {
            // Draw slightly darker for the body segments if desired, or just a solid color
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
        });

        // Display Score
        ctx.fillStyle = 'white';
        ctx.font = '16px monospace';
        ctx.fillText(`Score: ${score}`, 5, 20);
    }


    // --- Game Logic ---

    function updateGame() {
        // Calculate new head position
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Check for wall collision
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver("Hit the wall!");
            return;
        }

        // Check for self collision
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver("Hit yourself!");
                return;
            }
        }

        // Move the snake body
        snake.unshift(head);

        // Check for food collision
        if (head.x === food.x && head.y === food.y) {
            score++;
            // Place new food randomly
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        } else {
            // Remove the tail if no food was eaten (standard movement)
            snake.pop();
        }
    }

    function gameOver(reason) {
        clearInterval(gameInterval);
        ctx.fillStyle = 'white';
        ctx.font = '30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`GAME OVER! (${reason})`, canvas.width / 2, canvas.height / 2);
    }


    // --- Input Handling ---

    document.addEventListener('keydown', (event) => {
        const key = event.key;
        let newDx = dx;
        let newDy = dy;

        switch (key) {
            case 'ArrowUp':
                if (dy === 0) { newDx = 0; newDy = -1; }
                break;
            case 'ArrowDown':
                if (dy === 0) { newDx = 0; newDy = 1; }
                break;
            case 'ArrowLeft':
                if (dx === 0) { newDx = -1; newDy = 0; }
                break;
            case 'ArrowRight':
                if (dx === 0) { newDx = 1; newDy = 0; }
                break;
        }

        // Update direction only if a valid change was requested
        if (newDx !== dx || newDy !== dy) {
            dx = newDx;
            dy = newDy;
        }
    });


    // --- Main Game Loop Initialization ---

    function gameLoop() {
        updateGame();
        draw();
    }

    // Start the game loop
    const gameInterval = setInterval(gameLoop, gameSpeed);

</script>

</body>
</html>
